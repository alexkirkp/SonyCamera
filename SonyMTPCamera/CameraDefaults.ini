; CameraDefaults.ini - shipped defaults for supported cameras and lenses.
; Embedded in the DLL as a resource. Initially generated from the old
; CameraManager::SetupSupportedDevices (commit 97bf915); edit by hand from here.
;
; [Cameras\...] and [Lenses\...] sections become registry keys. "name = value" lines:
;   plain text            string value (doubles are strings too)
;   dword:N               DWORD value
;   list:NAME             the string defined in [Lists]
;   "text"                quoted string (\\ and \" escapes), for edge whitespace etc.
;   !                     remove an inherited value
;   @                     the name of the key's default value
;   inherits = SECTION    start from a [Defaults.*] section, then apply these lines

